# Render once per source Cluster. Replace the __PLACEHOLDER__ values in the
# E2E harness; this is intentionally not part of the operator's kustomization.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __GATEWAY_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: cnpg-test-gateway
    app.kubernetes.io/instance: __GATEWAY_NAME__
    app.kubernetes.io/part-of: vault-replica-credentials-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cnpg-test-gateway
      app.kubernetes.io/instance: __GATEWAY_NAME__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnpg-test-gateway
        app.kubernetes.io/instance: __GATEWAY_NAME__
        app.kubernetes.io/part-of: vault-replica-credentials-e2e
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: gateway
          image: __GATEWAY_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --listen-address=:__GATEWAY_PORT__
            - --health-address=:__HEALTH_PORT__
          env:
            - name: GATEWAY_BACKEND_ADDRESS
              value: __BACKEND_SERVICE__:5432
          ports:
            - name: postgres
              containerPort: __GATEWAY_PORT__
              protocol: TCP
            - name: health
              containerPort: __HEALTH_PORT__
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
