apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-prometheus
  namespace: cnpg-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: vault-replica-controller
        metrics_path: /metrics
        static_configs:
          - targets: [vault-replica-controller-metrics.cnpg-system.svc:8080]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-prometheus
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: e2e-prometheus
    app.kubernetes.io/part-of: vault-replica-credentials-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-prometheus
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: prometheus
          image: __PROMETHEUS_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
            - --web.listen-address=:9090
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: e2e-prometheus
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-prometheus
  namespace: cnpg-system
spec:
  selector:
    app.kubernetes.io/name: e2e-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
