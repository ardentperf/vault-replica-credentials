# E2E-only ephemeral Vault. Replace image, token, and host-port placeholders
# before applying.
apiVersion: v1
kind: Secret
metadata:
  name: vault-dev-token
  namespace: vault
type: Opaque
stringData:
  root-token: __VAULT_ROOT_TOKEN__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: vault-replica-credentials-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/part-of: vault-replica-credentials-e2e
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: vault
          image: __VAULT_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["vault"]
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:__VAULT_HOST_PORT__
            - -dev-root-token-id=$(VAULT_DEV_ROOT_TOKEN_ID)
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: vault-dev-token
                  key: root-token
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: vault-tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: __VAULT_HOST_PORT__
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: vault-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: vault-replica-credentials-e2e
spec:
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: http
      port: 8200
      targetPort: http
      protocol: TCP
