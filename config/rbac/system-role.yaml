apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-replica-controller
  namespace: cnpg-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
