apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-replica-controller
  namespace: cnpg-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # controller-runtime leader election emits an audit Event for acquisition.
  # Events are output only and are never watched as reconciliation input.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
