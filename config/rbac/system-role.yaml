apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-replica-controller
  namespace: cnpg-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # controller-runtime's leader election emits a normal Event in the system
  # namespace. This does not create an Event informer or expand target access.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
