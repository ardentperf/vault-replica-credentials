apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-replica-controller
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: vault-replica-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-replica-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-replica-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: vault-replica-controller
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/ardentperf/vault-replica-credentials:dev
          imagePullPolicy: IfNotPresent
          args:
            - --zap-log-level=info
          env:
            # Keep this identical to the CNPG controller's namespace list.
            - name: WATCH_NAMESPACE
              value: reporting
            - name: VAULT_ADDR
              value: https://vault.vault.svc:8200
            - name: VAULT_ALLOW_INSECURE_HTTP
              value: "false"
            - name: STATE_SECRET_NAME
              value: vault-replica-controller-state
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi