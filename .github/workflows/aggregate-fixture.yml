name: aggregate-fixture

on:
  workflow_dispatch:
    inputs:
      force_failure:
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  prerequisite:
    runs-on: ubuntu-24.04
    steps:
      - if: ${{ inputs.force_failure == 'true' }}
        run: exit 1
      - if: ${{ inputs.force_failure != 'true' }}
        run: true

  ci:
    name: aggregate-fixture-ci
    if: ${{ always() }}
    needs: [prerequisite]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: bash hack/aggregate-ci.sh "$REQUIRED_JOB_RESULTS"
