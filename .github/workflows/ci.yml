name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.4"
          check-latest: false
      - name: Install local validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck ripgrep
          case "$(uname -m)" in
            x86_64) kubectl_arch=amd64 ;;
            aarch64|arm64) kubectl_arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error -o /tmp/kubectl "https://dl.k8s.io/release/v1.34.2/bin/linux/${kubectl_arch}/kubectl"
          install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - run: make verify

  race:
    name: race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.4"
          check-latest: false
      - run: make test-race

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make image-build

  renovate:
    name: renovate-config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npx --yes --package renovate renovate-config-validator renovate.json

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.4"
          check-latest: false
      - name: Install E2E runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install pinned E2E tools
        run: |
          tool_dir="${RUNNER_TEMP}/e2e-tools"
          E2E_TOOL_DIR="${tool_dir}" bash test/e2e/install-tools.sh
          echo "${tool_dir}" >> "${GITHUB_PATH}"
      - name: Run ordered E2E suite
        run: make e2e
        env:
          E2E_OUTER_TIMEOUT: 110m
      - name: Upload redacted diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-diagnostics
          path: test/e2e/artifacts
          if-no-files-found: warn

  ci:
    name: ci
    if: ${{ always() }}
    needs: [verify, race, image, renovate, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Report validation results
        run: echo "required validation jobs completed"
      - name: Fail when any validation did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
